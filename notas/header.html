<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Maga's Philosophy Notes</title>
        <script>
            // set the theme before first paint, to avoid a flash
            (function () {
                var t = null;
                try { t = localStorage.getItem('theme'); } catch (e) {}
                if (t !== 'light' && t !== 'dark') {
                    t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.dataset.theme = t;
            })();
        </script>
        <link rel="stylesheet" href="main.css?v=__V__">
        <link rel="stylesheet" href="desktop.css?v=__V__">
        <link rel="icon" type="image/png" href="./favicon.png"/>
        <script src="script.js?v=__V__"></script>
    </head>
    <body>
        <div id="theme-toggle" role="group" aria-label="Tema">
        <span class="thumb"></span>
        <button type="button" data-theme-set="light" aria-label="Tema claro" title="Tema claro">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
        </button>
        <button type="button" data-theme-set="dark" aria-label="Tema escuro" title="Tema escuro">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
        </button>
        </div>
        <div id="title-wrap">
        <a id="home-link" href="./">
        <h5 id="pre-author">Notas de</h5>
        <h4 id="author">Maga</h4>
        </a>
        <img id="title-mascot" src="doom-mascot.png" alt="Doctor Doom"/>
        </div>
